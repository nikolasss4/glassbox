<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><title>Preferences</title>
<style>.combo{position:relative;max-width:320px}.combo [role=listbox]{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #bcccdc;border-radius:6px;max-height:180px;overflow:auto;z-index:5}
.combo [role=option]{padding:6px 10px;cursor:pointer}.combo [role=option]:hover{background:#f0f4f8}</style></head><body><header class="site"><a class="brand" href="/sites/traps/">Trap Gallery</a></header>
<main><div class="card"><h1>Preferences</h1>
<div class="muted">Billing country</div>
<div class="combo"><div role="combobox" tabindex="0" aria-expanded="false" aria-haspopup="listbox" id="combo" class="card" style="margin:4px 0;padding:8px 10px;cursor:pointer">Choose a country ▾</div>
<div role="listbox" id="lb" class="hidden"></div></div>
<button id="save" style="margin-top:12px">Save preferences</button><p id="msg" class="success" role="status"></p></div></main>
<script>
const C = ["Argentina","Australia","Austria","Belgium","Brazil","Canada","Chile","Denmark","Finland","France","Germany","Greece","India","Ireland","Italy","Japan","Mexico","Netherlands","Norway","Poland","Portugal","Romania","Spain","Sweden","Switzerland"];
let chosen = null;
const lb = document.getElementById("lb"), combo = document.getElementById("combo");
lb.innerHTML = C.map((c) => '<div role="option">' + c + '</div>').join("");
combo.onclick = () => { lb.classList.toggle("hidden"); combo.setAttribute("aria-expanded", String(!lb.classList.contains("hidden"))); };
lb.querySelectorAll("[role=option]").forEach((o) => o.onclick = () => { chosen = o.textContent; combo.textContent = chosen + " ▾"; lb.classList.add("hidden"); combo.setAttribute("aria-expanded", "false"); });
document.getElementById("save").onclick = () => {
  if (!chosen) { document.getElementById("msg").textContent = "Choose a country first."; return; }
  gbStore.set("traps:billing_country", chosen); document.getElementById("msg").textContent = "Saved: " + chosen;
};
</script></body></html>
