<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><title>Billing</title></head><body><header class="site"><a class="brand" href="/sites/traps/">Trap Gallery</a></header>
<main><div class="card"><h1>Billing</h1><p>Generate the invoice for October, then confirm it.</p>
<button id="gen">Generate invoice</button><p id="status" role="status"></p>
<button id="confirm" class="hidden">Confirm invoice</button></div></main>
<script>
document.getElementById("gen").onclick = () => {
  document.getElementById("gen").disabled = true;
  document.getElementById("status").textContent = "Generating… this can take a few seconds.";
  setTimeout(() => {
    document.getElementById("status").textContent = "Invoice INV-2026-10 is ready for review.";
    document.getElementById("confirm").classList.remove("hidden");
  }, 2500);
};
document.getElementById("confirm").onclick = () => { gbStore.set("traps:invoice_confirmed", "INV-2026-10"); document.getElementById("status").textContent = "Invoice confirmed."; document.getElementById("confirm").remove(); };
</script></body></html>
