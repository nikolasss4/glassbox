<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><title>Inventory feed</title></head><body><header class="site"><a class="brand" href="/sites/traps/">Trap Gallery</a></header>
<main><h1>Inventory feed</h1><p class="muted">Scroll to load more items.</p><div id="list"></div><p id="loading" class="muted">Loading more…</p></main>
<script>
let n = 0; const MAX = 60;
const favs = () => gbStore.get("traps:favorites", []);
function more() {
  const list = document.getElementById("list");
  for (let i = 0; i < 8 && n < MAX; i++) {
    n++;
    list.insertAdjacentHTML("beforeend", '<div class="card row" style="justify-content:space-between"><span>Item #' + n + ': widget batch ' + (n * 37 % 101) + '</span><button class="secondary fav" data-n="' + n + '">☆ Favorite item #' + n + '</button></div>');
  }
  if (n >= MAX) document.getElementById("loading").textContent = "End of feed.";
  document.querySelectorAll(".fav").forEach((b) => b.onclick = () => {
    const f = favs(); const k = +b.dataset.n;
    if (!f.includes(k)) f.push(k); gbStore.set("traps:favorites", f); b.textContent = "★ Favorited item #" + k;
  });
}
more();
window.addEventListener("scroll", () => { if (window.innerHeight + window.scrollY > document.body.scrollHeight - 200) more(); });
</script></body></html>
