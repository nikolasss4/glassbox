<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><title>Quarterly reports</title>
<style>#wall{position:fixed;inset:0;background:rgba(15,23,42,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#wall .card{max-width:640px;margin:24px}</style></head><body><header class="site"><a class="brand" href="/sites/traps/">Trap Gallery</a></header>
<main><div class="card"><h1>Quarterly reports</h1>
<div class="row"><button id="q2" class="secondary">Download Q2 report</button><button id="q3">Download Q3 report</button></div>
<p id="msg" class="success" role="status"></p></div></main>
<div id="wall"><div class="card"><h2>We value your privacy</h2><p>We use cookies to improve your experience. You can accept all or manage your preferences.</p>
<div class="row"><button id="accept">Accept all</button><button class="secondary" id="manage">Manage preferences</button></div></div></div>
<script>
const dl = (q) => () => { gbStore.set("traps:downloaded", q); document.getElementById("msg").textContent = "Downloading " + q.toUpperCase() + " report…"; };
document.getElementById("q2").onclick = dl("q2"); document.getElementById("q3").onclick = dl("q3");
document.getElementById("accept").onclick = () => document.getElementById("wall").remove();
document.getElementById("manage").onclick = () => { document.querySelector("#wall p").textContent = "Only essential cookies are enabled. Click Accept all to continue."; };
</script></body></html>
