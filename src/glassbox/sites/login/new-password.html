<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><script src="accounts.js"></script><title>New password · Acme Accounts</title></head><body>
<header class="site"><a class="brand" href="/sites/login/">Acme Accounts</a><nav><a href="/sites/login/">Sign in</a><a href="/sites/login/help.html">Help</a></nav></header>
<main><div class="card" style="max-width:480px">
  <h1>Choose a new password</h1>
  <form id="f"><label for="p1">New password</label><input type="password" id="p1">
  <label for="p2">Confirm new password</label><input type="password" id="p2">
  <div style="margin-top:16px"><button type="submit">Save password</button></div>
  <div id="err" class="error" role="alert"></div></form>
</div></main>
<script>
const user = new URLSearchParams(location.search).get("user");
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const a = document.getElementById("p1").value, b = document.getElementById("p2").value;
  const err = document.getElementById("err");
  if (a.length < 8) { err.textContent = "Password must be at least 8 characters."; return; }
  if (a !== b) { err.textContent = "Passwords do not match."; return; }
  gbStore.set("login:password:" + user, a);
  location.href = "/sites/login/?reset=1";
});
</script></body></html>
