<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><script src="accounts.js"></script><title>Sign in · Acme Accounts</title></head><body>
<header class="site"><a class="brand" href="/sites/login/">Acme Accounts</a><nav><a href="/sites/login/">Sign in</a><a href="/sites/login/help.html">Help</a></nav></header>
<main><div class="card" style="max-width:480px">
  <h1>Sign in</h1>
  <p id="notice" class="success"></p>
  <form id="f">
    <label for="u">Username</label><input type="text" id="u" name="username" autocomplete="off">
    <label for="p">Password</label><input type="password" id="p" name="password">
    <div style="margin-top:16px" class="row"><button type="submit">Sign in</button>
      <a href="/sites/login/reset.html">Forgot password?</a></div>
    <div id="err" class="error" role="alert"></div>
  </form>
</div></main>
<script>
if (new URLSearchParams(location.search).get("reset")) document.getElementById("notice").textContent = "Password updated. Sign in with your new password.";
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  if (!ACCOUNTS[u] || passwordFor(u) !== p) {
    document.getElementById("err").textContent = "Incorrect username or password.";
    return;
  }
  if (ACCOUNTS[u].twoFactor) {
    sessionStorage.setItem("pending2fa", u);
    location.href = "/sites/login/2fa.html";
    return;
  }
  gbStore.set("login:session", u);
  location.href = "/sites/login/welcome.html";
});
</script></body></html>
