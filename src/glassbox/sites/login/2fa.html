<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><script src="accounts.js"></script><title>Two-factor · Acme Accounts</title></head><body>
<header class="site"><a class="brand" href="/sites/login/">Acme Accounts</a><nav><a href="/sites/login/">Sign in</a><a href="/sites/login/help.html">Help</a></nav></header>
<main><div class="card" style="max-width:480px">
  <h1>Two-factor authentication</h1>
  <p>Enter the 6-digit code from your <a href="/sites/login/authenticator.html" target="_self">authenticator</a>.</p>
  <form id="f"><label for="c">Code</label><input type="text" id="c" inputmode="numeric" maxlength="6">
  <div style="margin-top:16px"><button type="submit">Verify</button></div>
  <div id="err" class="error" role="alert"></div></form>
</div></main>
<script>
const pending = sessionStorage.getItem("pending2fa");
if (!pending) location.href = "/sites/login/";
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (document.getElementById("c").value.trim() === TOTP[pending]) {
    gbStore.set("login:session", pending);
    sessionStorage.removeItem("pending2fa");
    location.href = "/sites/login/welcome.html";
  } else {
    document.getElementById("err").textContent = "That code is not valid.";
  }
});
</script></body></html>
