<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/sites/common.css"><script src="/sites/store.js"></script><script src="accounts.js"></script><title>Dashboard · Acme Accounts</title></head><body>
<header class="site"><a class="brand" href="/sites/login/">Acme Accounts</a><nav><a href="/sites/login/">Sign in</a><a href="/sites/login/help.html">Help</a></nav></header>
<main><div class="card"><h1 id="h"></h1><p>You are signed in.</p>
<button class="secondary" id="out">Sign out</button></div></main>
<script>
const s = gbStore.get("login:session", null);
document.getElementById("h").textContent = s ? "Welcome, " + s : "Not signed in";
document.getElementById("out").onclick = () => { gbStore.set("login:session", null); location.href = "/sites/login/"; };
</script></body></html>
